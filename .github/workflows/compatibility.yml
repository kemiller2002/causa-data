name: causa-storage-v1.0.0 compatibility gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Python validator
        run: python3 -m pip install --quiet "jsonschema==4.26.0"
      - name: Fetch pinned domain engine
        run: tools/fetch-engine.sh
        env:
          PRIOR_REHEARSAL_READ_TOKEN: ${{ secrets.PRIOR_REHEARSAL_READ_TOKEN }}
      - name: Build
        run: |
          dotnet build tools/src/Causa.Tool -c Release
          dotnet build tools/consumers/rehearsal-adapter -c Release
          dotnet build tools/consumers/clean-fsharp -c Release
      - name: Unit tests
        run: dotnet test tools/tests/Causa.Contract.Tests -c Release
      - name: Schema bundle (independent Python check)
        run: |
          python3 tools/py/schema_bundle.py check contract/v1.0.0/schemas
          python3 tools/py/schema_bundle.py digest contract/v1.0.0/schemas | cmp - contract/v1.0.0/schemas/bundle.json
          python3 tools/py/render_registry.py contract/v1.0.0/schemas check contract/v1.0.0/CONTRACT.md
      - name: DRAFT causa-storage 1.1.0 - schema bundle (independent Python check) and fixtures (deterministic rebuild, 1.1.0 reader, negatives)
        run: |
          python3 tools/py/schema_bundle.py check contract/v1.1.0/schemas
          python3 tools/py/schema_bundle.py digest contract/v1.1.0/schemas 1.1.0 | cmp - contract/v1.1.0/schemas/bundle.json
          python3 -I tools/schema-authoring/author_schemas_v110.py "$RUNNER_TEMP/s110" && diff -r --exclude=bundle.json "$RUNNER_TEMP/s110" contract/v1.1.0/schemas
          dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll v110-verify .
      - name: causa-storage 1.2.0 - schema bundle (independent Python check), deterministic schemas, fixtures (independent Python reader)
        run: |
          python3 tools/py/schema_bundle.py check contract/v1.2.0/schemas
          python3 tools/py/schema_bundle.py digest contract/v1.2.0/schemas 1.2.0 | cmp - contract/v1.2.0/schemas/bundle.json
          python3 -I tools/schema-authoring/author_schemas_v120.py "$RUNNER_TEMP/s120" && diff -r --exclude=bundle.json "$RUNNER_TEMP/s120" contract/v1.2.0/schemas
          python3 -I tools/py/v120_fixtures.py verify .
      - name: Dataset verification
        run: dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll verify .
      - name: Deterministic regeneration
        run: dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll reproduce .
      - name: Compatibility gate (lock; anchored to the release tag once it exists)
        run: |
          if git rev-parse -q --verify "refs/tags/causa-storage-v1.0.0" >/dev/null; then
            dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll gate . --anchor causa-storage-v1.0.0
          else
            echo "pre-freeze: no release tag yet, gate runs unanchored"
            dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll gate .
          fi
      - name: Gate self-test (deliberate breaking mutations must fail)
        run: dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll gate-selftest .
      - name: Consumer - rehearsal engine via adapter
        run: dotnet tools/consumers/rehearsal-adapter/bin/Release/net10.0/rehearsal-adapter.dll verify .
      - name: Consumer - clean F# consumer
        run: dotnet tools/consumers/clean-fsharp/bin/Release/net10.0/clean-consumer.dll verify .
      - name: Consumer - independent Python consumer
        run: python3 tools/consumers/python/causa_consumer.py verify .
      - name: Independent 1.0.0 consumers refuse causa-storage 1.1.0 and 1.2.0 data whole (CONTRACT 1.1.0 and 1.2.0 section 3)
        run: |
          # The clean F# and Python consumers are 1.0.0 readers: each must refuse the 1.1.0 fixture at stage 5 with
          # CAUSA.UNSUPPORTED_VERSION. (The rehearsal adapter reads only the repository's listed 1.0.0 sets through
          # the frozen Store.validate, which ST-06 already shows refusing 1.1.0.)
          for d in fixtures/v1.1.0/investigations/*/ fixtures/v1.2.0/investigations/*/; do
            out="$(dotnet tools/consumers/clean-fsharp/bin/Release/net10.0/clean-consumer.dll validate "$d" || true)"
            echo "clean-fsharp $d: $out"
            case "$out" in CAUSA.UNSUPPORTED_VERSION*) ;; *) echo "::error::clean F# consumer did not refuse $d as unsupported"; exit 1 ;; esac
            out="$(python3 -I -c 'import os, sys; from pathlib import Path; sys.path.insert(0, "tools/consumers/python"); import causa_consumer as c; d = Path(sys.argv[1]); s = c.load_schemas(Path("contract/v1.0.0/schemas")).value; r = c.run_pipeline(d.name, {f: (d / f).read_bytes() for f in os.listdir(d)}, s); print(r.primary.code if r.primary else "ACCEPTED")' "${d%/}")"
            echo "python $d: $out"
            test "$out" = CAUSA.UNSUPPORTED_VERSION || { echo "::error::Python consumer did not refuse $d as unsupported"; exit 1; }
          done
      - name: Active historical catalog - engine replay, provenance and deterministic rebuild
        run: dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll historical-verify .
      - name: Active historical catalog - independent Python checks (immutability, secrets, refusals)
        run: python3 -I tools/py/historical_catalog.py verify . --base origin/main
      - name: Active four-case catalog demonstration-v1 - engine replay of the immutable template
        run: dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll template-verify --template demonstration-v1 --root .
      - name: Active four-case catalog demonstration-v1 - pointer, manifest, byte identity, Python reader
        run: python3 -I tools/py/demonstration_catalog.py verify .
