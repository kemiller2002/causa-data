name: causa live GitHub persistence (REST Git Data API)

# Triggered by a push that changes .github/live-rest/request.txt (workflow_dispatch needs the
# workflow on the default branch). Pushes made with GITHUB_TOKEN do not re-trigger workflows. Exercises the REST write path (blobs -> tree -> commit -> non-forced
# ref update) against this repository, in an isolated workspaces/demo/<runId>/ namespace on
# the branch it runs on. Never touches fixtures/ or contract/.
on:
  workflow_dispatch:
  push:
    # Never on main: a merge that carries request.txt would otherwise write demo workspaces to main.
    branches-ignore:
      - main
    paths:
      - ".github/live-rest/request.txt"

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CAUSA_WRITE_BACKEND: rest
      CAUSA_LIVE_BRANCH: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tools/src/Causa.Tool -c Release
      - name: Phase A (create, load, append) then phase B in a separate process
        run: |
          set -euo pipefail
          RUN="rest-${GITHUB_RUN_ID}"
          FIXTURE_COMMIT="$(git rev-parse HEAD)"
          dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll github-live a . "$RUN" "$FIXTURE_COMMIT" | tee phase-a.txt
          INV="$(grep '^investigationId=' phase-a.txt | cut -d= -f2)"
          dotnet tools/src/Causa.Tool/bin/Release/net10.0/causa.dll github-live b . "$RUN" "$FIXTURE_COMMIT" "$INV" | tee phase-b.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-rest-results
          path: .local/github-live/*/results-*.json
